name: Atualizar Dashboard EFPC

on:
  push:
    branches: [main]
    paths:
      # Dispara sempre que arquivos brutos novos chegam em "Dados Extração",
      # ou quando algo já tratado/cadastral muda — cobre tanto o fluxo normal
      # (você sobe brutos novos) quanto uma correção manual num tratado.
      - 'Dados Extração/**'
      - 'Dados Tratados/**'
      - 'Dados Cadastrais/**'
      - 'Dados Manuais/**'
      - 'Dados Participantes/**'
      - 'Fundos Exclusivos/**'
      - 'efpc_dashboard_gerador_v4.py'
      - 'modulo_tratamento_balancetes.py'
      - 'modulo_serie_historica.py'
      - 'fichas_efpc.py'
  workflow_dispatch:  # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl xlrd numpy

      - name: Rodar gerador e exportar dashboard_data.json
        run: |
          python efpc_dashboard_gerador_v4.py

      - name: Commitar resultado (JSON + pastas organizadas/arquivadas)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Atualiza dashboard_data.json [automático]"
          git push
